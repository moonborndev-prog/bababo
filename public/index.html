<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0c">
  <title>BaBaBo Quiz</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
  <div id="connBanner" class="conn-banner hidden">Bağlantı koptu, yeniden bağlanılıyor...</div>

  <div class="p-wrap">
    <div class="p-topbar">
      <div>
        <img id="topLogo" src="/img/logo-line.png" alt="BaBaBo Quiz" class="logo-img logo-line hidden">
      </div>
      <div id="meBar" class="hidden" style="display:flex; gap:8px; align-items:center;">
        <span class="chip"><strong id="meName"></strong></span>
        <span class="chip">Puan: <strong id="meScore" class="num">0</strong></span>
      </div>
    </div>

    <div class="p-main">

      <!-- Katilim -->
      <div id="v-join" class="view">
        <div class="card join-card">
          <img src="/img/logo-stack.png" alt="BaBaBo Quiz" class="logo-img join-logo">
          <p class="muted" id="joinSub">Ekrandaki PIN kodunu ve takım adını yaz</p>
          <div style="margin-top:18px; display:flex; flex-direction:column; gap:12px;">
            <input id="inPin" class="input pin-input" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN">
            <input id="inName" class="input" maxlength="20" autocomplete="off" placeholder="Takım adın">
            <button id="btnJoin" class="btn btn-primary btn-big">Katıl</button>
          </div>
          <div id="joinErr" class="error-box hidden"></div>
        </div>
      </div>

      <!-- Lobi -->
      <div id="v-lobby" class="view hidden">
        <div class="card centered" style="padding:30px 20px;">
          <h2 id="lobbyTitle"></h2>
          <p style="font-size:19px; font-weight:700; margin-top:12px;">İçerdesin, <span id="lobbyName"></span>!</p>
          <p class="muted" style="animation:pulse 2.2s infinite;">Oyunun başlamasını bekle</p>
          <p class="team-count" style="margin-top:18px;"><strong id="lobbyCount" class="num">0</strong> takım katıldı</p>
          <div id="teamGrid" class="team-grid"></div>
        </div>
      </div>

      <!-- Soru -->
      <div id="v-question" class="view hidden">
        <div class="q-header">
          <span class="chip">Soru <strong id="qNo" class="num"></strong></span>
          <span class="chip"><strong id="qPts" class="num"></strong> puan</span>
        </div>
        <div class="timer-track"><div id="timerFill" class="timer-fill"></div></div>
        <div id="timerNum" class="timer-num num"></div>
        <div id="qText" class="q-text"></div>
        <div id="optGrid" class="opt-grid"></div>
        <form id="fibForm" class="fib-form hidden" autocomplete="off">
          <input id="fibInput" class="input" maxlength="100" placeholder="Cevabını yaz..." autocomplete="off" autocapitalize="off">
          <button class="btn btn-primary btn-big" type="submit">Gönder</button>
        </form>
      </div>

      <!-- Cevap alindi -->
      <div id="v-waiting" class="view hidden">
        <div class="card centered" style="padding:34px 22px;">
          <h2>Cevabın alındı</h2>
          <p class="muted" style="animation:pulse 1.6s infinite;">Diğer oyuncular bekleniyor...</p>
        </div>
      </div>

      <!-- Sonuc -->
      <div id="v-result" class="view hidden">
        <div class="card result-hero">
          <div id="resVerdict" class="verdict"></div>
          <div id="resGain" class="gain num"></div>
          <div id="resAnswerBox" class="answer-reveal hidden"></div>
          <div class="stat-row">
            <span class="chip">Toplam: <strong id="resScore" class="num"></strong></span>
            <span class="chip">Sıran: <strong id="resRank" class="num"></strong></span>
          </div>
        </div>
      </div>

      <!-- Skor tablosu -->
      <div id="v-leaderboard" class="view hidden">
        <h2 class="centered">Skor Tablosu</h2>
        <p class="centered muted tiny" id="lbProgress"></p>
        <div id="lbList" class="lb-list"></div>
      </div>

      <!-- Final -->
      <div id="v-final" class="view hidden">
        <h2 class="centered">Oyun Bitti!</h2>
        <div id="podium" class="podium"></div>
        <div class="card centered" style="margin-top:14px;">
          <p style="font-size:18px; font-weight:800;" id="finalYou"></p>
          <p class="muted" id="finalMeta"></p>
        </div>
      </div>

      <!-- Bilgi (atildi / iptal) -->
      <div id="v-info" class="view hidden">
        <div class="card centered" style="padding:34px 22px;">
          <h2 id="infoTitle"></h2>
          <p class="muted" id="infoText"></p>
          <button id="btnInfoHome" class="btn btn-primary" style="margin-top:14px;">Yeni oyuna katıl</button>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared.js"></script>
  <script src="/player.js"></script>
</body>
</html>
